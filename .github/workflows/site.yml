name: site

# Builds the project page (site/) and deploys it to Cloudflare Workers at
# aria-orchestrator.dev. Releases are read from the GitHub API during the
# build, so publishing a release redeploys the page.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/plan/status.json"
      - "assets/brand/**"
      - ".github/workflows/site.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push does not cancel one in progress.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      # A release event would check out its tag; deploying an older tag
      # would roll the page back. Always build the default branch.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm test
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
