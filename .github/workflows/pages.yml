name: pages

# Former GitHub Pages deploy. The site now lives on Cloudflare (site.yml);
# Pages keeps serving its last deploy until this workflow is removed.
on:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push does not cancel one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
