name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm test

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # Builds the pages (pretest), then tests them. GITHUB_TOKEN lets the
      # build read the releases, as the deploy does.
      - run: npm test
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Bundles the Worker and reads dist/ without deploying, so a broken
      # wrangler install shows up here rather than on the first deploy.
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler"
        env:
          WRANGLER_SEND_METRICS: "false"
