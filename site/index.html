<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARIA - Agentic SDLC Orchestrator</title>
<meta name="description" content="ARIA simplifies the software development lifecycle through intelligent multi-agent orchestration.">
<meta name="theme-color" content="#0B1020">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:url" content="https://leandroaps.github.io/aria-orchestrator/">
<meta property="og:title" content="ARIA - Agentic SDLC Orchestrator">
<meta property="og:description" content="ARIA simplifies the software development lifecycle through intelligent multi-agent orchestration.">
<meta property="og:image" content="https://leandroaps.github.io/aria-orchestrator/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The ARIA monogram on a midnight background">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --midnight: #0B1020;
    --snow: #F8FAFC;
    --violet: #7C3AED;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--midnight);
    color: var(--snow);
    font-family: var(--sans);
  }
  main {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 1rem;
  }
  .logo {
    display: block;
    width: clamp(120px, 32vmin, 320px);
    aspect-ratio: 480 / 432;
    height: auto;
  }
  .signature { text-align: center; }
  .signature h1 {
    margin: 0;
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: 0.5em;
    margin-right: -0.5em; /* keep the spaced letters centred */
    color: var(--snow);
  }
  /* Violet on Midnight is 3.3:1, enough only for large text (WCAG AA,
     at least 18.66px bold): the violet lines stay at 19.2px, weight 600. */
  .signature .descriptor {
    margin: 0.75rem 0 2rem;
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--violet);
  }
  .signature .slogan { margin: 0; font-size: 1.2rem; font-weight: 600; line-height: 1.4; color: var(--snow); }
  .signature .slogan + .slogan { margin-top: 1.25rem; color: var(--violet); }
  @media (prefers-reduced-motion: no-preference) {
    main { animation: fade-in 600ms ease-out both; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="aria-mark.svg" width="480" height="432" alt="ARIA — Agentic SDLC Orchestrator">
  <div class="signature">
    <h1>ARIA</h1>
    <p class="descriptor">Agentic SDLC Orchestrator</p>
    <p class="slogan">Complexity orchestrated.</p>
    <p class="slogan">Simplicity delivered.</p>
  </div>
</main>
</body>
</html>
